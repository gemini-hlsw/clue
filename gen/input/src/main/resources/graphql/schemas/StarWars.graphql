type Query {
  hero(episode: Episode!): Character!
  character(id: ID!): Character
  human(id: ID!): Human
  droid(id: ID!): Droid
}

enum Episode {
  NEWHOPE
  EMPIRE
  JEDI
}

interface Character {
  id: String!
  name: String
  friends: [Character!]
  more_friends: [Character!]
  appearsIn: [Episode!]
}

interface Pilot {
  vehicle: String
}

type Human implements Character & Pilot {
  id: String!
  name: String
  friends: [Character!]
  more_friends: [Character!]
  appearsIn: [Episode!]
  homePlanet: String
  vehicle: String
}

type Droid implements Character {
  id: String!
  name: String
  friends: [Character!]
  more_friends: [Character!]
  appearsIn: [Episode!]
  functions: [String!]
  primaryFunction: String @deprecated(reason: "Use 'functions' instead")
}