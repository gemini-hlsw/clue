# Generated by sbt-lucuma's lucumaSlackNotifyGenerate. Do not edit by hand; change the
# `lucumaSlackNotify*` settings in build.sbt and regenerate.
#
# GitHub only notifies the actor who triggered a run, and merges are pushed by a bot, so a
# red `main` would otherwise reach nobody. Watching whole workflows means jobs added
# later are covered without touching this file.
name: CI Failure Notification

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Slack
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-22.04
    steps:
      # Best effort, and deliberately tolerant: a transient API failure here must not cost
      # us the notification, which is the whole point of this workflow.
      - name: Collect failed jobs
        id: failed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          jobs=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            -q '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
            | paste -sd ', ' - || true)
          echo "jobs=${jobs:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          GPP_SLACK_WEBHOOK_URL: ${{ secrets.GPP_SLACK_WEBHOOK_URL }}
          FAILED_JOBS: ${{ steps.failed.outputs.jobs }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "${GPP_SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::GPP_SLACK_WEBHOOK_URL is not set; skipping the Slack notification"
            exit 0
          fi
          text=$(printf ':x: *%s* %s %s on `%s`\n*Failed:* %s\n*Commit:* `%s` (%s)\n%s' \
            "${{ github.repository }}" "$WORKFLOW" "$CONCLUSION" "main" \
            "${FAILED_JOBS:-unknown}" "${HEAD_SHA:0:8}" "$ACTOR" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$GPP_SLACK_WEBHOOK_URL"
